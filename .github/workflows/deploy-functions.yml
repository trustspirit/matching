name: Deploy edge functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Push migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Deploy functions
        # --no-verify-jwt is belt-and-braces here: supabase/config.toml already
        # sets verify_jwt = false for both functions, but the flag makes the
        # requirement visible at the deploy step too, since neither function
        # is ever called with a Supabase-issued JWT (see config.toml's comment).
        run: |
          supabase functions deploy lookup --no-verify-jwt --project-ref "$PROJECT_REF"
          supabase functions deploy admin-import --no-verify-jwt --project-ref "$PROJECT_REF"
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
