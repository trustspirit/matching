<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Two overlapping circles: the site's red dot motif, doubled to stand for
       a pair. Fills are the color-primary and color-ink-soft design tokens; no
       new colour is introduced. Note for editors: XML forbids a double hyphen
       inside a comment, so token names are written without their CSS prefix. -->
  <circle cx="11" cy="16" r="10" fill="#e60023" />
  <circle cx="21" cy="16" r="10" fill="#211922" fill-opacity="0.92" />
</svg>
